name: Daily Signal Run

on:
  schedule:
    - cron: '45 6 * * 1-5'   # Mon–Fri 06:45 UTC (after 06:30 pipeline time)
  workflow_dispatch:           # manual trigger via GitHub UI

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Build static site
        run: python build_site.py

      - name: Commit & push results
        run: |
          git config user.name  "aksel-bot"
          git config user.email "aksel-bot@users.noreply.github.com"
          git add db/aksel.db signals/output/ docs/
          git diff --staged --quiet || git commit -m "signals $(date -u +%Y-%m-%d)"
          git push
